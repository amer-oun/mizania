packages:
  - apps/*
  - packages/*

# Versions shared by several packages. Reference them with "catalog:".
catalog:
  # typescript-eslint 8 supports TypeScript < 6.1
  typescript: ~6.0.3
  # eslint-config-next's plugins (react, jsx-a11y, import) support ESLint <= 9
  eslint: ^9.39.5
  "@eslint/js": ^9.39.5
  "@types/node": ^24.19.1
  vitest: ^5.0.3
  "@vitest/coverage-v8": ^5.0.3 # must match the vitest version
  fast-check: ^4.10.2
  tsx: ^4.23.15
  tsdown: ^0.23.0
  pino: ^10.4.0
  pino-pretty: ^13.1.3
  zod: ^4.6.5
  rimraf: ^6.1.3

# Dependencies allowed to run install scripts (native binaries). pnpm blocks
# all others. Review before adding to this list.
allowBuilds:
  "@parcel/watcher": true # next-intl
  "@swc/core": true # next-intl
  esbuild: true # tsx, drizzle-kit, tsdown
  unrs-resolver: true # eslint-import-resolver-typescript (via eslint-config-next)
